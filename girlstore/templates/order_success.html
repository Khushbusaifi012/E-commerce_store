{% extends "base.html" %}
{% load static %}
{% block title %}Order confirmed{% endblock %}
{% block content %}
<div class="flex min-h-[65vh] flex-col items-center justify-center px-4 py-16 sm:px-6">
    <div class="w-full max-w-lg rounded-3xl border border-zinc-200/80 bg-white/95 px-8 py-12 text-center shadow-[0_24px_60px_-20px_rgba(0,0,0,0.12)] ring-1 ring-black/[0.04] backdrop-blur-md dark:border-zinc-700 dark:bg-zinc-900/90 dark:ring-white/5">
        <div class="mx-auto mb-6 flex size-16 items-center justify-center rounded-full bg-emerald-100 text-3xl text-emerald-700 dark:bg-emerald-950/80 dark:text-emerald-400" aria-hidden="true">✓</div>
        <h1 class="font-display text-2xl font-bold tracking-tight text-zinc-900 dark:text-zinc-50 sm:text-3xl">Thank you!</h1>
        <p class="mt-4 text-zinc-600 dark:text-zinc-400">Your order’s in — we're packing every piece with extra care.</p>
        <p class="mt-3 text-sm text-zinc-500 dark:text-zinc-500">Updates will follow soon. Thanks for trusting <strong class="font-semibold text-rose-600 dark:text-rose-400">GirlyCart</strong>.</p>
        <a href="{% url 'home' %}" class="mt-8 inline-flex rounded-full bg-gradient-to-r from-rose-600 to-violet-600 px-8 py-3.5 text-sm font-semibold text-white shadow-lg shadow-rose-500/25 transition-[transform] hover:from-rose-500 hover:to-violet-500 active:scale-[0.98] motion-reduce:active:scale-100">Continue shopping</a>
    </div>
</div>
{% endblock %}
