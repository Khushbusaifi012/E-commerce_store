{% extends "base.html" %}
{% load static %}
{% block title %}Sign up{% endblock %}
{% block content %}
<div class="relative flex min-h-[70vh] items-center justify-center overflow-hidden px-4 py-16 sm:px-6">
    <div class="pointer-events-none absolute -left-24 top-1/3 size-64 rounded-full bg-violet-400/25 blur-3xl motion-reduce:blur-none" aria-hidden="true"></div>
    <div class="pointer-events-none absolute -right-16 top-1/2 size-52 rounded-full bg-rose-400/30 blur-3xl motion-reduce:blur-none" aria-hidden="true"></div>
    <div class="relative w-full max-w-md rounded-3xl border border-zinc-200/80 bg-white/90 p-8 shadow-[0_24px_60px_-20px_rgba(0,0,0,0.12)] ring-1 ring-black/[0.04] backdrop-blur-md sm:p-10">
        <h1 class="font-display text-2xl font-bold tracking-tight text-zinc-900">Create account</h1>
        <p class="mt-2 text-sm text-zinc-600">Join GirlyCart in under a minute.</p>
        <form method="post" class="mt-8 space-y-4">
            {% csrf_token %}
            <div>
                <label for="username" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Username</label>
                <input id="username" type="text" name="username" required class="w-full rounded-xl border border-zinc-200 bg-zinc-50/50 px-4 py-3 text-sm text-zinc-900 outline-none ring-rose-400/40 transition focus:border-rose-300 focus:bg-white focus:ring-4 dark:border-zinc-600 dark:bg-zinc-950/50 dark:text-zinc-100 dark:focus:border-rose-500/50 dark:focus:bg-zinc-900">
            </div>
            <div>
                <label for="email" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Email</label>
                <input id="email" type="email" name="email" required autocomplete="email" class="w-full rounded-xl border border-zinc-200 bg-zinc-50/50 px-4 py-3 text-sm text-zinc-900 outline-none ring-rose-400/40 transition focus:border-rose-300 focus:bg-white focus:ring-4 dark:border-zinc-600 dark:bg-zinc-950/50 dark:text-zinc-100 dark:focus:border-rose-500/50 dark:focus:bg-zinc-900">
            </div>
            <div>
                <label for="password1" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Password</label>
                <input id="password1" type="password" name="password1" required autocomplete="new-password" class="w-full rounded-xl border border-zinc-200 bg-zinc-50/50 px-4 py-3 text-sm text-zinc-900 outline-none ring-rose-400/40 transition focus:border-rose-300 focus:bg-white focus:ring-4 dark:border-zinc-600 dark:bg-zinc-950/50 dark:text-zinc-100 dark:focus:border-rose-500/50 dark:focus:bg-zinc-900">
            </div>
            <div>
                <label for="password2" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-zinc-500 dark:text-zinc-400">Confirm password</label>
                <input id="password2" type="password" name="password2" required autocomplete="new-password" class="w-full rounded-xl border border-zinc-200 bg-zinc-50/50 px-4 py-3 text-sm text-zinc-900 outline-none ring-rose-400/40 transition focus:border-rose-300 focus:bg-white focus:ring-4 dark:border-zinc-600 dark:bg-zinc-950/50 dark:text-zinc-100 dark:focus:border-rose-500/50 dark:focus:bg-zinc-900">
            </div>
            <button type="submit" class="w-full rounded-full bg-gradient-to-r from-rose-600 to-violet-600 py-3.5 text-sm font-semibold text-white shadow-lg shadow-rose-500/30 transition-[transform,box-shadow] hover:from-rose-500 hover:to-violet-500 hover:shadow-rose-500/40 active:scale-[0.98] motion-reduce:active:scale-100">Sign up</button>
        </form>
        <p class="mt-8 text-center text-sm text-zinc-600 dark:text-zinc-400">Already have an account? <a href="{% url 'login' %}" class="font-semibold text-rose-600 hover:text-rose-500 dark:text-rose-400 dark:hover:text-rose-300">Log in</a></p>
    </div>
</div>
{% endblock %}
